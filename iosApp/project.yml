name: iosApp
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: DayBlocks
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Compose Multiplatform renders at the display's full refresh rate only when this is set;
        # without it ProMotion devices are held to 60 Hz and scrolling the timeline visibly stutters.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Background refresh rolls the reminder window forward while the app is closed — iOS holds
        # only 64 pending notifications, so the schedule is a window that has to keep moving.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.meko123456.dayblocks.refresh
        # dayblocks://today is what the widget opens.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.meko123456.dayblocks
            CFBundleURLSchemes:
              - dayblocks
    # The App Group is how the widget reads what the app writes: the timeline and the faces.
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.meko123456.dayblocks
    dependencies:
      - target: DayBlocksWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.dayblocks
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # -lsqlite3 because SQLDelight's native driver calls the system SQLite, and ComposeApp is a
        # *static* framework: a linker option declared on it does not travel to the app that links
        # it, so the app has to ask for libsqlite3 itself or every sqlite3_* symbol is undefined.
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp -lsqlite3"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # :composeApp declares iosArm64 and iosSimulatorArm64 and deliberately not iosX64. A
        # `generic/platform=iOS Simulator` destination asks for every simulator arch, requests
        # x86_64, and the Kotlin plugin has no target for it. Stated once here rather than as a
        # flag every xcodebuild invocation has to remember.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # Ad-hoc signing: free, and all the simulator needs.
        CODE_SIGN_IDENTITY: "-"
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          # A default, never an override: a hardcoded Android Studio path is right on a developer's
          # Mac and wrong on a CI runner, where setup-java has already exported JAVA_HOME.
          export JAVA_HOME="${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}"
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  DayBlocksWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DayBlocks
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/DayBlocksWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.meko123456.dayblocks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.dayblocks.widget
        CODE_SIGN_IDENTITY: "-"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.dayblocks.uitests
        # Without this the bundle has no Info.plist, and signing fails with a message that blames
        # the signature rather than the missing plist.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppUITests
