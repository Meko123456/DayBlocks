name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a timeout of about three times its slowest green run (measured October 2026).
# GitHub's default is six hours, and a job that hangs (a simulator or emulator that never comes
# up, say) would otherwise hold the run, and keep its log unreadable, for all of them.
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # testAndroidHostTest at the root, not per module: naming modules is a filter, and a test
      # added to a module nobody listed would be collected by nobody while the tick stays green.
      - name: Unit tests, debug build, lint
        run: ./gradlew testAndroidHostTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace

      # A screenshot test that fails leaves what it drew and the difference next to the committed
      # PNG; keep them, or the failure says a screen changed without showing how.
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: feature/*/build/outputs/roborazzi/
          if-no-files-found: ignore

      # Debug never runs R8. Without this, a keep-rules mistake first surfaces when somebody builds
      # a release by hand; lintVitalRelease is the release-blocking lint that lintDebug omits.
      - name: Release build (R8 + release-blocking lint)
        run: ./gradlew :androidApp:assembleRelease :androidApp:lintVitalRelease --stacktrace

  ios:
    # The shared code declares iOS targets; this is what proves they build and behave the same
    # there. Compiling proves valid Kotlin/Native, running the tests proves equal behaviour.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared tests on the iOS simulator, iosArm64 compile
        run: ./gradlew iosSimulatorArm64Test :composeApp:compileKotlinIosArm64 --stacktrace

  iosApp:
    # The Swift half. Without this job every line under iosApp/ and the Gradle-to-Xcode wiring the
    # app links through are checked by nobody — the same hole a declared-but-never-built target is.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # For Xcode's sake: the target's pre-build phase runs Gradle to produce ComposeApp.framework.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      # The project is generated rather than committed, so generating it is part of the check.
      - name: Generate the Xcode project
        working-directory: iosApp
        run: xcodegen generate
      # A simulator has to boot now, because the UI tests run on one — but it is chosen, not
      # named. Runner images change which devices they carry, and a hardcoded "iPhone 16" turns an
      # image update into a red build for no reason.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "using $UDID"

      # test, not build. A green build proves the Swift compiles and the framework is where Xcode
      # looks; it says nothing about whether a tap reaches the shared editor and the saved block
      # comes back from the database onto Today. The UI tests drive exactly that chain.
      - name: Build and UI-test the iOS app
        working-directory: iosApp
        run: |
          xcodebuild test -project iosApp.xcodeproj -scheme iosApp \
                     -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
                     -configuration Debug

  release-launches:
    # Building the release proves R8 ran, not that the result starts. On 30 September 2026 three
    # apps in this collection turned out to have minified builds that died before their first frame
    # (R8 full mode had stripped a constructor a library reaches for by reflection), and every check
    # was green. This app was one of them (55c3100). This installs the R8 build on an emulator,
    # opens it, and fails if it crashes or is not running fifteen seconds later. Proven both ways in
    # Nabiji #13.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # CI has no release key, so the build comes out unsigned. Any key will do for installing it
      # on a throwaway emulator, so this makes one up.
      - name: Build the minified release and sign it with a throwaway key
        run: |
          ./gradlew :androidApp:assembleRelease --stacktrace
          keytool -genkeypair -keystore "$RUNNER_TEMP/launch.jks" -storepass launchcheck \
            -keypass launchcheck -alias launch -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=release launch check"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$(ls androidApp/build/outputs/apk/release/*.apk | head -1)" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/launch.jks" --ks-pass pass:launchcheck \
            --key-pass pass:launchcheck --out "$RUNNER_TEMP/release.apk" "$RUNNER_TEMP/aligned.apk"

      # The emulator wants more disk than ubuntu-latest leaves free, and it needs KVM.
      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/launch-release.sh ${{ runner.temp }}/release.apk
